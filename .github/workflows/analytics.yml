name: youtube-analytics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pipeline/analytics/**
      - .github/workflows/analytics.yml

permissions:
  contents: write

concurrency:
  group: youtube-analytics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 분석 데이터 가져오기 (영상별 지표·시청 유지율·유입 경로)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 pipeline/analytics/fetch_analytics.py
      - name: 결과를 저장소에 보관 (content/analytics/)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A content/analytics
          git commit -m "chore: 유튜브 분석 결과 보관" || echo "변경 없음"
          git pull --rebase --autostash origin main
          git push
