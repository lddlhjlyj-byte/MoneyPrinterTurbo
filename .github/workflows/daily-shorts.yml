name: daily-shorts
on:
  schedule:
    - cron: "30 21 * * *" # 매일 06:30 KST
  workflow_dispatch:

permissions:
  contents: write
  models: read
  actions: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 주제 선정 · 대본 생성 · 규칙 검사
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 pipeline/auto/generate.py
      - name: 커밋 후 렌더링 시작
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A shorts-video/src content pipeline/auto/topics.json
          if git diff --cached --quiet; then echo "변경 없음(건너뜀)"; exit 0; fi
          git commit -m "chore: 자동 생성 대본 ($(date -u +%F))"
          git pull --rebase --autostash origin main
          git push
          gh workflow run infocard.yml --ref main
