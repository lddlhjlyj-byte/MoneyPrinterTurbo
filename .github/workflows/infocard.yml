name: infocard-video
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shorts-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 폰트·ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - run: pip install "edge-tts>=7,<8"
      - run: npm ci
      - name: 한국어 음성 생성 (장면 길이 자동 맞춤)
        run: python scripts/tts.py
      - name: 영상 렌더링
        run: npx remotion render InfoCard out/infocard.mp4
      - name: 영상 정보 확인
        run: ffprobe -v error -show_entries stream=codec_name,width,height,duration -of default=nw=1 out/infocard.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: infocard
          path: shorts-video/out/infocard.mp4
