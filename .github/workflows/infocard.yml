name: infocard-video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - shorts-video/src/cards.json
      - .github/workflows/infocard.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shorts-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 폰트·ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - run: pip install "edge-tts>=7,<8"
      - run: npm ci
      - name: 한국어 음성 생성 (장면 길이 자동 맞춤)
        run: python scripts/tts.py
      - name: 영상 렌더링
        run: npx remotion render InfoCard out/infocard.mp4
      - name: 영상 정보 확인
        run: ffprobe -v error -show_entries stream=codec_name,width,height,duration -of default=nw=1 out/infocard.mp4
      - name: 확인용 장면 사진·음량 저장 (저장소 verify/ 폴더)
        run: |
          mkdir -p ../verify
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/infocard.mp4 | cut -d. -f1)
          for t in 2 6 9 13 18 22 27 33 38 44 50 56; do
            if [ "$t" -lt "$DUR" ]; then
              ffmpeg -v error -y -ss $t -i out/infocard.mp4 -frames:v 1 -vf scale=360:-1 ../verify/f_$t.jpg || true
            fi
          done
          ffmpeg -v error -i out/infocard.mp4 -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume" > ../verify/audio.txt || true
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,duration -of default=nw=1 out/infocard.mp4 > ../verify/probe.txt
      - name: 영상·썸네일을 고유 파일명으로 보관 (cards.json의 name, 덮어쓰기 방지)
        run: |
          NAME=$(python3 -c "import json;print(json.load(open('src/cards.json',encoding='utf-8')).get('name') or '')")
          if [ -z "$NAME" ]; then NAME="video-$(date +%Y%m%d-%H%M)"; fi
          echo "파일명: $NAME"
          mkdir -p ../content/videos ../content/thumbnails
          cp out/infocard.mp4 "../content/videos/$NAME.mp4"
          npx remotion still Thumbnail "../content/thumbnails/$NAME.png"
          echo "$NAME" > ../verify/name.txt
      - name: verify·content 폴더 커밋
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add verify content/videos content/thumbnails
          git commit -m "chore: InfoCard 결과 보관 ($(cat verify/name.txt))" || echo "변경 없음"
          git pull --rebase --autostash origin main
          git push
      - name: 영상 파일을 video 브랜치에 저장 (바로 받을 수 있게)
        working-directory: .
        run: |
          cp shorts-video/out/infocard.mp4 /tmp/infocard.mp4
          git checkout --orphan video
          git rm -rf -q . || true
          cp /tmp/infocard.mp4 infocard.mp4
          git add infocard.mp4
          git commit -q -m "latest infocard video"
          git push -f origin video
      - uses: actions/upload-artifact@v4
        with:
          name: infocard
          path: shorts-video/out/infocard.mp4
